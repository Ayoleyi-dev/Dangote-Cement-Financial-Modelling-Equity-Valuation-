name: Historical financial data checks

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: python scripts/analyze.py --check
      - run: python scripts/forecast.py --check
      - run: python scripts/valuation.py --check
      - run: python scripts/comparables.py --check
      - run: python scripts/ev_ebitda.py --check
      - run: python scripts/assumption_stress.py --check
